<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Vinyl Player - Duo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>  
    <div class="player-container">

        <div class="deck single-deck" id="deck-a">
            <div class="turntable-wrapper">
                <div class="turntable">
                    <div class="vinyl"></div>
                </div>
            </div>
            <div class="single-library library">
                <h2>Deck A</h2>
                <input type="file" class="fileInput" accept="audio/*" style="display: none;">
                <button class="uploadBtn primary-btn">🎵 노래 업로드</button>
                
                <div class="progress-container">
                    <div class="time-info">
                        <span class="currentTime">0:00</span>
                        <span class="duration">0:00</span>
                    </div>
                    <input type="range" class="progressSlider" min="0" max="100" value="0">
                </div>

                <div class="control-group">
                    <div class="transport-controls">
                        <button class="play-btn">▶ PLAY</button>
                        <button class="stop-btn">■ STOP</button>
                        <button class="reverse-btn">◀ REV</button>
                    </div>
                    <label>Speed: <span class="speedValue">1.000</span>x</label>
                    <input type="range" class="speedSlider" min="-2" max="2" step="0.1" value="1">
                </div>

                <div class="eq-container">
                    <div class="gain-slider to-center-container flex-direction-column">
                        <span>gain</span>
                        <input type="range" class="vertical-slider" min="0" max="1" step="0.01" value="0.8">
                        <button class="reset-btn">reset</button>
                    </div>
                    <div class="low-slider to-center-container flex-direction-column">
                        <span>low</span>
                        <input type="range" class="vertical-slider" step="0.5" min="-24" max="12" value="0" >
                        <button class="reset-btn">reset</button>
                    </div>
                    <div class="middle-slider to-center-container flex-direction-column">
                        <span>mid</span>
                        <input type="range" class="vertical-slider" step="0.5" min="-24" max="12" value="0" >
                        <button class="reset-btn">reset</button>
                    </div>
                    <div class="high-slider to-center-container flex-direction-column">
                        <span>high</span>
                        <input type="range" class="vertical-slider" step="0.5" min="-24" max="12" value="0" >
                        <button class="reset-btn">reset</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 중앙 멀티 deck -->
        <div class="deck" id="multi-deck">
            <div class="multi-deck-container" id="multi-deck-container-a">
                <input type="number" class="bpm-input" step="0.1" value="120">
                <!-- onchange="deckA.updateBPM(this.value)-->
                <button class="sync-toggle-btn">sync</button>
                <span class="bpm-viewr">120bpm</span>
                <div class="audio-wave-viewer"></div>
            </div>
            <div class="multi-deck-container" id="multi-deck-container-b">
                <input type="number" class="bpm-input" step="0.1" value="120">
                <!-- onchange="deckA.updateBPM(this.value)-->
                <button class="sync-toggle-btn">sync</button>
                <span class="bpm-viewr">120bpm</span>
                <div class="audio-wave-viewer"></div>
            </div>
                
            <div class="crossfader">
                <input type="range" class="crossfader-slider" min="0" max="100" value="50">
            </div>

        </div>
    
            
        

                <div class="deck single-deck" id="deck-b">
            <div class="turntable-wrapper">
                <div class="turntable">
                    <div class="vinyl"></div>
                </div>
            </div>
            <div class="single-library library">
                <h2>Deck B</h2>
                <input type="file" class="fileInput" accept="audio/*" style="display: none;">
                <button class="uploadBtn primary-btn">🎵 노래 업로드</button>
                
                <div class="progress-container">
                    <div class="time-info">
                        <span class="currentTime">0:00</span>
                        <span class="duration">0:00</span>
                    </div>
                    <input type="range" class="progressSlider" min="0" max="100" value="0">
                </div>

                <div class="control-group">
                    <div class="transport-controls">
                        <button class="play-btn">▶ PLAY</button>
                        <button class="stop-btn">■ STOP</button>
                        <button class="reverse-btn">◀ REV</button>
                    </div>
                    <label>Speed: <span class="speedValue">1.000</span>x</label>
                    <input type="range" class="speedSlider" min="-2" max="2" step="0.1" value="1">
                </div>

                <div class="eq-container" id="eq-container-b">
                    <div class="gain-slider to-center-container flex-direction-column">
                        <span>gain</span>
                        <input type="range" class="vertical-slider" id="vol-b" min="0" max="1" step="0.01" value="0.8">
                        <button class="reset-btn" id="gain-reset-b">reset</button>
                    </div>
                    <div class="low-slider to-center-container flex-direction-column">
                        <span>low</span>
                        <input type="range" class="vertical-slider" id="low-b" step="0.5" min="-24" max="12" value="0" >
                        <button class="reset-btn" id="low-reset-b">reset</button>
                    </div>
                    <div class="middle-slider to-center-container flex-direction-column">
                        <span>mid</span>
                        <input type="range" class="vertical-slider" id="mid-b" step="0.5" min="-24" max="12" value="0" >
                        <button class="reset-btn" id="middle-reset-b">reset</button>
                    </div>
                    <div class="high-slider to-center-container flex-direction-column">
                        <span>high</span>
                        <input type="range" class="vertical-slider" id="high-b" step="0.5" min="-24" max="12" value="0" >
                        <button class="reset-btn" id="high-reset-b">reset</button>
                    </div>
                </div>
            </div>
        </div>

        
    </div>
    <script src="script.js"></script>
</body>
</html>
