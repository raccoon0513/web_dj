<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Vinyl Player - Duo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>  
    <div class="player-container">
        <div class="deck" id="deck-a">
            <div class="turntable-wrapper">
                <div class="turntable">
                    <div class="vinyl"></div>
                </div>
            </div>
            <div class="single_library library">
                <h2>Deck A</h2>
                <input type="file" class="fileInput" accept="audio/*" style="display: none;">
                <button class="uploadBtn primary-btn">🎵 노래 업로드</button>
                
                <div class="progress-container">
                    <div class="time-info">
                        <span class="currentTime">0:00</span>
                        <span class="duration">0:00</span>
                    </div>
                    <input type="range" class="progressSlider" min="0" max="100" value="0">
                </div>

                <div class="control-group">
                    <label>Speed: <span class="speedValue">1.000</span>x</label>
                    <input type="range" class="speedSlider" min="-2" max="2" step="0.1" value="1">
                </div>
            </div>
        </div>
        
        <div class="multi_library library">
            <div class="audio_wave_viewer"></div>
            
            
        </div>

        <div class="deck" id="deck-b">
            <div class="turntable-wrapper">
                <div class="turntable">
                    <div class="vinyl"></div>
                </div>
            </div>
            <div class="single_library library">
                <h2>Deck B</h2>
                <input type="file" class="fileInput" accept="audio/*" style="display: none;">
                <button class="uploadBtn primary-btn">🎵 노래 업로드</button>
                
                <div class="progress-container">
                    <div class="time-info">
                        <span class="currentTime">0:00</span>
                        <span class="duration">0:00</span>
                    </div>
                    <input type="range" class="progressSlider" min="0" max="100" value="0">
                </div>

                <div class="control-group">
                    <label>Speed: <span class="speedValue">1.000</span>x</label>
                    <input type="range" class="speedSlider" min="-2" max="2" step="0.1" value="1">
                </div>
            </div>

            
        </div>

        
    </div>
    <script src="script.js"></script>
</body>
</html>
