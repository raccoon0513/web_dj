<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Vinyl Player - Duo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>  
    <div class="player-container">

        <div class="deck single-deck" id="deck-a">
            <div class="turntable-wrapper">
                <div class="turntable">
                    <div class="vinyl"></div>
                </div>
            </div>
            <div class="single-library library">
                <h2>Deck A</h2>
                <input type="file" class="fileInput" accept="audio/*" style="display: none;">
                <button class="uploadBtn primary-btn">🎵 노래 업로드</button>
                
                <div class="progress-container">
                    <div class="time-info">
                        <span class="currentTime">0:00</span>
                        <span class="duration">0:00</span>
                    </div>
                    <input type="range" class="progressSlider" min="0" max="100" value="0">
                </div>

                <div class="control-group">
                    <label>Speed: <span class="speedValue">1.000</span>x</label>
                    <input type="range" class="speedSlider" min="-2" max="2" step="0.1" value="1">
                </div>

                <div class="eq-container" id="eq-container-a">
                    <div class="gain-slider to-center-container flex-direction-column">
                        <span>gain</span>
                        <div class="to-center-container flex-direction-row">
                            <input type="range" class="vertical-slider" id="vol-a" step="0.1" min="-24" max="12">
                            <div class="to-center-container flex-direction-column" style="height: 100%;">
                                <!-- TODO : 눈금 표시해줄 방법 고민해보기 -->
                                <span>12</span>
                                <span>0</span>
                                <span>-12</span>
                                <span>-24</span>
                            </div>
                        </div>
                        <button class="reset-btn" id="gain-reset-a">reset</button>
                    </div>
                    <div class="low-slider to-center-container flex-direction-column">
                        <span>low</span>
                        <input type="range" class="vertical-slider" id="low-a" step="0.1" min="-24" max="12" >
                        <button class="reset-btn" id="low-reset-a">reset</button>
                    </div>
                    <div class="middle-slider to-center-container flex-direction-column">
                        <span>mid</span>
                        <input type="range" class="vertical-slider" id="mid-a" step="0.1" min="-24" max="12" >
                        <button class="reset-btn" id="middle-reset-a">reset</button>
                    </div>
                    <div class="high-slider to-center-container flex-direction-column">
                        <span>high</span>
                        <input type="range" class="vertical-slider" id="high-a" step="0.1" min="-24" max="12" >
                        <button class="reset-btn" id="high-reset-a">reset</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 중앙 멀티 deck -->
        <div class="deck" id="multi-deck">
            <div class="audio-wave-container">
                <div class="audio-wave-viewer" id="audio-wave-viewer-a"></div>
                <button class="sync-toggle-btn" id="sync-toggle-btn-a">sync</button>
                <span class="bpm-viewr" id="bpm-viewr-a">0bpm</span>

                <div class="audio-wave-viewer" id="audio-wave-viewer-b"></div>
                <button class="sync-toggle-btn" id="sync-toggle-btn-b">sync</button>
                <span class="bpm-viewr" id="bpm-viewr-b">0bpm</span>
            </div>
            
            <div class="crossfader">
                <input type="range" class="crossfader-slider" min="0" max="100" value="50">
            </div>

            
        </div>

                <div class="deck single-deck" id="deck-b">
            <div class="turntable-wrapper">
                <div class="turntable">
                    <div class="vinyl"></div>
                </div>
            </div>
            <div class="single-library library">
                <h2>Deck B</h2>
                <input type="file" class="fileInput" accept="audio/*" style="display: none;">
                <button class="uploadBtn primary-btn">🎵 노래 업로드</button>
                
                <div class="progress-container">
                    <div class="time-info">
                        <span class="currentTime">0:00</span>
                        <span class="duration">0:00</span>
                    </div>
                    <input type="range" class="progressSlider" min="0" max="100" value="0">
                </div>

                <div class="control-group">
                    <label>Speed: <span class="speedValue">1.000</span>x</label>
                    <input type="range" class="speedSlider" min="-2" max="2" step="0.1" value="1">
                </div>

                <div class="eq-container" id="eq-container-b">
                    <div class="gain-slider to-center-container">
                        <span>gain</span>
                        <input type="range" class="vertical-slider" id="gain-slider-b">
                        <button class="reset-btn" id="gain-reset-b">reset</button>
                    </div>
                    <div class="low-slider to-center-container">
                        <span>low</span>
                        <input type="range" class="vertical-slider" id="low-slider-b">
                        <button class="reset-btn" id="low-reset-b">reset</button>
                    </div>
                    <div class="middle-slider to-center-container">
                        <span>low</span>
                        <input type="range" class="vertical-slider" id="middle-slider-b">
                        <button class="reset-btn" id="middle-reset-b">reset</button>
                    </div>
                    <div class="high-slider to-center-container">
                        <span>high</span>
                        <input type="range" class="vertical-slider" id="high-slider-b">
                        <button class="reset-btn" id="high-reset-a">reset</button>
                    </div>
                </div>
            </div>
        </div>

        
    </div>
    <script src="script.js"></script>
</body>
</html>
